<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "Source Sans Pro", "Source Sans 3", system-ui, -apple-system, sans-serif; }
  #scene { position: relative; width: 100%; height: 560px; border-radius: 16px; overflow: hidden;
    background: radial-gradient(ellipse at 50% 45%, #1a2f6b 0%, #0b1533 55%, #050a1c 100%); }
  canvas { display: block; cursor: grab; touch-action: none; }
  canvas.drag { cursor: grabbing; }
  canvas.survol { cursor: pointer; }
  #bulle { position: absolute; display: none; pointer-events: none; white-space: nowrap;
    transform: translate(-50%, calc(-100% - 16px)); background: rgba(255, 255, 255, .97); color: #1F2328;
    border-radius: 10px; border-left: 6px solid var(--c); padding: 8px 14px; font-size: 15px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, .4); }
  #bulle b { display: block; font-size: 17px; }
  #bulle .v { color: var(--c); font-weight: 700; }
  #bulle small { color: #57606A; font-size: 13px; }
  #aide { position: absolute; left: 16px; bottom: 12px; color: rgba(225, 233, 255, .78); font-size: 13px;
    pointer-events: none; }
  #erreur { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    color: #E1E9FF; font-size: 16px; padding: 24px; text-align: center; }
</style>
</head>
<body>
  <div id="scene">
    <div id="bulle"></div>
    <div id="aide"></div>
    <div id="erreur"></div>
  </div>
  <script type="module" src="./globe.js"></script>
</body>
</html>
