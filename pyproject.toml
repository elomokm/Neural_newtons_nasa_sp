[project]
name = "trend-detective"
version = "1.0.0"
description = "Earth Detective : tendances des données NASA par région, avec test de significativité (NASA Space Apps 2026)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyyaml>=6",
  "pymannkendall>=1.4",
  "scipy>=1.13",
  "requests>=2.32",
  "earthaccess>=0.19",
  "harmony-py>=1.8",
  "streamlit>=1.40",
  "plotly>=5.24",
  "openai>=1.66",
  "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "app"]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
extend-exclude = ["spike", "earth-detective", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["trend", "agent", "conftest", "api", "backend", "mock", "textes", "charte", "components"]
